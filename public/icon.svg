<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#151e2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Viewfinder Frame Corners -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 392 332 L 392 372 A 20 20 0 0 1 372 392 L 332 392" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 180 392 L 140 392 A 20 20 0 0 1 120 372 L 120 332" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Document Sheet -->
  <rect x="176" y="160" width="160" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Document Lines -->
  <line x1="206" y1="200" x2="306" y2="200" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="206" y1="230" x2="286" y2="230" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="206" y1="260" x2="296" y2="260" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Zero-Knowledge Lock Shield Badge -->
  <g transform="translate(256, 305)" filter="url(#glow)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="4"/>
    <path d="M -16 -4 L -16 -12 A 16 16 0 0 1 16 -12 L 16 -4" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="-18" y="-4" width="36" height="28" rx="6" fill="#10b981"/>
    <circle cx="0" cy="8" r="4" fill="#0f172a"/>
    <line x1="0" y1="12" x2="0" y2="17" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Laser Scan Beam Line -->
  <line x1="140" y1="256" x2="372" y2="256" stroke="#34d399" stroke-width="3" opacity="0.8" stroke-dasharray="6 6"/>
</svg>
